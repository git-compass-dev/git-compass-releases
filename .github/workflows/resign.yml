# Signed documents expire after 120 days (freeze protection). This refreshes
# every index and the catalog on the 1st of each month.
name: resign
on:
  schedule:
    - cron: '17 3 1 * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: registry
  cancel-in-progress: false
env:
  GOPRIVATE: github.com/git-compass-dev/*
  GOTOOLCHAIN: local
jobs:
  resign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Access other git-compass-dev repos (read)
        env:
          GC_READ_TOKEN: ${{ secrets.GC_READ_TOKEN }}
        run: git config --global url."https://x-access-token:${GC_READ_TOKEN}@github.com/git-compass-dev/".insteadOf "https://github.com/git-compass-dev/"
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Re-sign
        env:
          GC_SIGNING_KEY: ${{ secrets.GC_SIGNING_KEY }}
        run: go run ./cmd/gcpack resign -repo .
      - name: Commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json modules
          git commit -m "Re-sign registry documents"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
