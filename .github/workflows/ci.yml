name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
env:
  GOPRIVATE: github.com/git-compass-dev/*
  GOTOOLCHAIN: local
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Access other git-compass-dev repos
        env:
          GC_READ_TOKEN: ${{ secrets.GC_READ_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${GC_READ_TOKEN}@github.com/git-compass-dev/".insteadOf "https://github.com/git-compass-dev/"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test ./...
      - name: Verify published documents
        run: |
          if [ -f keys/registry.pub ] && [ -f catalog.json ]; then go run ./cmd/gcpack verify -repo .; else echo "nothing published yet"; fi
